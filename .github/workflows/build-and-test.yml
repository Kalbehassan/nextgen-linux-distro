name: Build and Test

on:
  push:
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make test
      - run: make lint
      - run: make build-rootfs configure package smoke
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-diagos
          path: |
            build/*.tar.gz
            build/*.sha256
            build/*.manifest
